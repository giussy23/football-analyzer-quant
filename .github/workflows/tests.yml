name: tests

# Corre la suite de pytest en cada push y pull request.
# (Listo para usar en cuanto el proyecto se versione en GitHub.)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Se clona dentro de una carpeta llamada football_analyzer para que el
      # paquete `football_analyzer` sea importable (igual que en local: el padre
      # del paquete queda en sys.path vía pytest.ini → pythonpath = ..).
      - uses: actions/checkout@v4
        with:
          path: football_analyzer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        working-directory: football_analyzer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar tests
        working-directory: football_analyzer
        run: pytest
