<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaBet — Logo Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #010804;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    gap: 40px;
    padding: 40px 20px;
  }
  h2 {
    color: #4ade80;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: -30px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    flex-wrap: wrap;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .label {
    color: #22c55e;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.5;
  }
  img, object {
    display: block;
  }
  .sep {
    width: 300px;
    height: 1px;
    background: linear-gradient(to right, transparent, #22c55e44, transparent);
  }
</style>
</head>
<body>

<h2>AlphaBet v15.0 — Logo Preview</h2>

<div class="row">
  <div class="card">
    <span class="label">Logo Principal · 400×400</span>
    <img src="logo_alphabet.svg" width="400" height="400" alt="AlphaBet Logo"/>
  </div>
</div>

<div class="sep"></div>

<div class="row">
  <div class="card">
    <span class="label">Banner · 480×140</span>
    <img src="logo_banner.svg" width="480" height="140" alt="AlphaBet Banner"/>
  </div>
</div>

<div class="sep"></div>

<div class="row">
  <div class="card">
    <span class="label">Favicon · 64×64</span>
    <img src="favicon.svg" width="64" height="64" alt="AlphaBet Favicon"/>
  </div>
  <div class="card">
    <span class="label">Favicon · 128×128</span>
    <img src="favicon.svg" width="128" height="128" alt="AlphaBet Favicon"/>
  </div>
  <div class="card">
    <span class="label">Favicon · 256×256</span>
    <img src="favicon.svg" width="256" height="256" alt="AlphaBet Favicon"/>
  </div>
</div>

</body>
</html>
